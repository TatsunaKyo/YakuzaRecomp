name: Development tools
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B out/checks -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build out/checks --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir out/checks -C Debug --output-on-failure
      - name: Configure Windows runtime host with synthetic code
        if: runner.os == 'Windows'
        run: cmake -S . -B "${{ runner.temp }}/yakuza-boot-host" -A x64 -DYAKUZA_BUILD_BOOT_PROBE=ON -DYAKUZA_MAIN_GENERATED_DIR=${{ github.workspace }}/tests/fixtures/boot-host -DPS2X_ENABLE_FFMPEG=OFF
      - name: Build Windows runtime host
        if: runner.os == 'Windows'
        run: cmake --build "${{ runner.temp }}/yakuza-boot-host" --config Debug --parallel 2 --target yakuza_boot_probe
      - name: Validate Windows runtime host input handling
        if: runner.os == 'Windows'
        run: ctest --test-dir "${{ runner.temp }}/yakuza-boot-host" -C Debug --output-on-failure -R boot_host_input_validation
