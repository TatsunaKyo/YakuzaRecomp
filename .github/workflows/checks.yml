name: Development tools
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B out/checks -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build out/checks --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir out/checks -C Debug --output-on-failure
