name: Development tools
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B out/checks -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build out/checks --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir out/checks -C Debug --output-on-failure
      - name: Configure Windows runtime host with synthetic code
        if: runner.os == 'Windows'
        run: cmake -S . -B "${{ runner.temp }}/yakuza-boot-host" -A x64 -DYAKUZA_BUILD_BOOT_PROBE=ON -DYAKUZA_MAIN_GENERATED_DIR=${{ github.workspace }}/tests/fixtures/boot-host -DPS2X_ENABLE_FFMPEG=OFF
      - name: Build Windows runtime host
        if: runner.os == 'Windows'
        run: cmake --build "${{ runner.temp }}/yakuza-boot-host" --config Debug --parallel 2 --target yakuza_boot_probe mmi_permutation_tests boot_dispatch_tests boot_priority_tests boot_resume_tests boot_overlay_tests boot_vif_tests boot_gif_tests boot_vu_flags_tests boot_ipu_tests boot_spr_tests
      - name: Validate Windows runtime host input handling
        if: runner.os == 'Windows'
        run: ctest --test-dir "${{ runner.temp }}/yakuza-boot-host" -C Debug --output-on-failure -R "^(boot_|mmi_permutations$)"
      - name: Configure Windows diagnostic package
        if: runner.os == 'Windows'
        run: cmake -S . -B out/windows-diagnostic -A x64 -DBUILD_TESTING=OFF -DYAKUZA_BUILD_BOOT_PROBE=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DFETCHCONTENT_SOURCE_DIR_PS2RECOMP=${{ github.workspace }}/out/checks/_deps/ps2recomp-src
      - name: Build Windows diagnostic package
        if: runner.os == 'Windows'
        run: cmake --build out/windows-diagnostic --config Release --parallel 2 --target yakuza_iop_probe
      - name: Stage Windows diagnostic package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'windows-iop-diagnostic'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item 'out/windows-diagnostic/Release/yakuza_iop_probe.exe' $package
          Copy-Item 'packaging/windows-diagnostic/README.txt' $package
          Copy-Item 'COPYING', 'THIRD_PARTY_NOTICES.md' $package
          $executable = Join-Path $package 'yakuza_iop_probe.exe'
          $info = @{
            source_commit = $env:GITHUB_SHA
            platform = 'Windows x64'
            kind = 'IOP development diagnostic'
            executable = 'yakuza_iop_probe.exe'
            bytes = (Get-Item $executable).Length
            sha256 = (Get-FileHash $executable -Algorithm SHA256).Hash.ToLowerInvariant()
            original_game_code_included = $false
            original_game_data_included = $false
          }
          $info | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $package 'build-info.json')
      - name: Validate packaged Windows executable
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, pathlib, struct, subprocess
          def imported_dlls(data):
              assert data[:2] == b'MZ'
              pe = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[pe:pe+4] == b'PE\0\0'
              machine, count = struct.unpack_from('<HH', data, pe+4)
              size = struct.unpack_from('<H', data, pe+20)[0]
              optional = pe+24
              assert machine == 0x8664 and struct.unpack_from('<H', data, optional)[0] == 0x20b
              sections = [struct.unpack_from('<IIII', data, optional+size+i*40+8) for i in range(count)]
              def offset(rva):
                  for virtual_size, address, raw_size, raw in sections:
                      if address <= rva < address+max(virtual_size, raw_size):
                          assert rva-address < raw_size
                          return raw+rva-address
                  raise AssertionError('Unmapped PE import data')
              imports = struct.unpack_from('<I', data, optional+112+8)[0]
              assert struct.unpack_from('<II', data, optional+112+13*8) == (0, 0), 'Unexpected delay imports'
              names = set()
              cursor = offset(imports)
              for _ in range(256):
                  descriptor = struct.unpack_from('<5I', data, cursor)
                  if not any(descriptor):
                      return sorted(names)
                  start = offset(descriptor[3])
                  names.add(data[start:data.index(b'\0', start)].decode('ascii').lower())
                  cursor += 20
              raise AssertionError('Unterminated PE import table')
          package = pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-iop-diagnostic'
          executable = package / 'yakuza_iop_probe.exe'
          for arguments, expected in [(['--help'], 0), ([], 2)]:
              result = subprocess.run([str(executable), *arguments], capture_output=True, text=True, timeout=20)
              assert result.returncode == expected, (result.returncode, result.stdout, result.stderr)
              assert ('Usage: yakuza_iop_probe' in result.stdout) if arguments else ('Supply IRX module files' in result.stderr)
          expected_files = {'yakuza_iop_probe.exe', 'README.txt', 'COPYING', 'THIRD_PARTY_NOTICES.md', 'build-info.json'}
          assert {path.name for path in package.iterdir()} == expected_files
          libraries = imported_dlls(executable.read_bytes())
          system = {'kernel32.dll', 'user32.dll', 'advapi32.dll', 'shell32.dll', 'ole32.dll', 'oleaut32.dll',
                    'ws2_32.dll', 'bcrypt.dll', 'ntdll.dll', 'gdi32.dll', 'winmm.dll', 'imm32.dll',
                    'dwmapi.dll', 'version.dll', 'shlwapi.dll', 'msvcrt.dll', 'ucrtbase.dll'}
          assert all(name in system or name.startswith(('api-ms-win-', 'ext-ms-win-')) for name in libraries), libraries
          info_path = package / 'build-info.json'
          info = json.loads(info_path.read_text(encoding='utf-8-sig'))
          info.update(imported_dlls=libraries, packaged_cli_checks_passed=True)
          info_path.write_text(json.dumps(info, indent=2)+'\n', encoding='utf-8')
      - name: Upload Windows diagnostic package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-iop-diagnostic-x64
          path: ${{ runner.temp }}/windows-iop-diagnostic/
          if-no-files-found: error
          retention-days: 14
